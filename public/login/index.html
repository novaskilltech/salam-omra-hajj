<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion Conciergerie • Salam Omra Hajj</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#fcfbf8] text-slate-800 min-h-screen flex items-center justify-center p-4 selection:bg-amber-100 selection:text-amber-900">

  <div class="max-w-md w-full bg-white border border-[#e8ded0] rounded-3xl p-8 shadow-xl relative overflow-hidden">
    <!-- Glow doré subtil -->
    <div class="absolute -top-12 -right-12 w-40 h-40 bg-amber-500/10 rounded-full blur-2xl pointer-events-none"></div>

    <!-- LOGO -->
    <div class="text-center mb-8">
      <div class="w-14 h-14 rounded-2xl bg-amber-50 border border-amber-300/60 flex items-center justify-center text-amber-800 mx-auto mb-3 shadow-sm">
        <svg class="w-8 h-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M12 2C8 6 6 10 6 15h12c0-5-2-9-6-13z"/>
          <path d="M4 19h16M7 22h10"/>
        </svg>
      </div>
      <h1 class="text-xl font-extrabold tracking-wider text-slate-900">SALAM OMRA</h1>
      <p class="text-xs text-amber-800 font-bold mt-0.5">Espace Conciergerie & Conseillers</p>
    </div>

    <!-- MESSAGE D'ERREUR -->
    <div id="errorBox" class="hidden mb-5 p-3.5 rounded-xl bg-rose-50 border border-rose-200 text-rose-800 text-xs font-semibold flex items-center gap-2">
      <svg class="w-4 h-4 text-rose-600 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
      <span id="errorMsg">Mot de passe incorrect</span>
    </div>

    <!-- FORMULAIRE -->
    <form onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1.5 uppercase tracking-wider">Mot de passe d'accès</label>
        <div class="relative">
          <input type="password" id="password" required placeholder="••••••••••••"
                 class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-300 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-teal-600 transition">
          <button type="button" onclick="togglePass()" class="absolute right-3 top-3 text-slate-400 hover:text-slate-600">
            <svg id="eyeIcon" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
          </button>
        </div>
        <p class="text-[11px] text-slate-500 mt-1">Accès sécurisé pour l'équipe Salam Omra (par défaut: <code>salamomra2026</code>).</p>
      </div>

      <button type="submit" id="submitBtn"
              class="w-full py-3.5 px-4 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs shadow-md transition flex items-center justify-center gap-2">
        <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/></svg>
        <span>Accéder au Tableau de bord</span>
      </button>
    </form>

    <div class="mt-6 pt-4 border-t border-slate-100 text-center">
      <a href="/" class="text-xs text-slate-500 hover:text-amber-800 font-semibold transition flex items-center justify-center gap-1.5">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
        Retourner au site public
      </a>
    </div>
  </div>

  <script>
    function togglePass() {
      const p = document.getElementById('password');
      p.type = p.type === 'password' ? 'text' : 'password';
    }

    async function handleLogin(e) {
      e.preventDefault();
      const p = document.getElementById('password').value;
      const errorBox = document.getElementById('errorBox');
      const errorMsg = document.getElementById('errorMsg');
      const submitBtn = document.getElementById('submitBtn');

      errorBox.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span>Vérification...</span>';

      try {
        const res = await fetch('/api/v1/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: p })
        });
        const data = await res.json();

        if (res.ok && data.success) {
          sessionStorage.setItem('salamomra_logged_in', 'true');
          window.location.href = '/dashboard';
        } else {
          errorMsg.textContent = data.error || "Mot de passe erroné.";
          errorBox.classList.remove('hidden');
        }
      } catch (err) {
        errorMsg.textContent = "Erreur de connexion : " + err.message;
        errorBox.classList.remove('hidden');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/></svg> <span>Accéder au Tableau de bord</span>';
      }
    }
  </script>

</body>
</html>
